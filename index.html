<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#FFFBF3" />
    <meta name="description" content="Duolingo pentru Limba Semnelor Române" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Signa</title>
    <!-- Tema + mărimea textului înainte de primul paint (vezi src/lib/preferences.js). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- Ecranul verde de pornire — copie statică a <SplashScreen>, vizibilă cât se
         descarcă JS-ul. React îl înlocuiește la primul render. -->
    <style>
      html, body, #root { height: 100%; margin: 0; }
      .sg-boot { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: linear-gradient(135deg, #064e3b, #065f46 55%, #059669); font-family: 'Nunito', ui-rounded, system-ui, sans-serif; }
      .sg-boot-mark { position: relative; width: 104px; height: 104px; }
      .sg-boot-ring { position: absolute; inset: 0; border-radius: 30px; border: 2px solid rgba(255,255,255,.45);
        animation: sg-boot-ring 2.6s cubic-bezier(.22,1,.36,1) infinite; }
      .sg-boot-ring + .sg-boot-ring { animation-delay: 1.3s; }
      .sg-boot-tile { position: relative; width: 100%; height: 100%; border-radius: 30px; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(150deg, #fff 20%, #ecfdf5); box-shadow: 0 18px 40px rgba(4,44,32,.35); }
      .sg-boot-tile img { height: 90%; filter: drop-shadow(0 0 .6px rgba(5,150,105,.9)) drop-shadow(0 1.5px 2px rgba(5,150,105,.35)); }
      .sg-boot-word { color: #fff; font-weight: 900; font-size: 22px; letter-spacing: .32em; padding-left: .32em; }
      @keyframes sg-boot-ring { 0% { transform: scale(.85); opacity: .55; } 70%, 100% { transform: scale(1.5); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .sg-boot-ring { animation: none; } }
    </style>
    <div id="root">
      <div class="sg-boot" role="status" aria-label="Se încarcă Signa">
        <div class="sg-boot-mark">
          <span class="sg-boot-ring"></span><span class="sg-boot-ring"></span>
          <span class="sg-boot-tile"><img src="/logo.png" alt="" /></span>
        </div>
        <span class="sg-boot-word">SIGNA</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
