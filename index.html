<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#FFFBF3" />
    <meta name="description" content="Duolingo pentru Limba Semnelor Române" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Signa</title>
    <!-- Tema + mărimea textului înainte de primul paint (vezi src/lib/preferences.js). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- Ecranul de pornire — copie statică a <SplashScreen> (discul cu sigla și
         arcul care se rotește pe inel), vizibilă cât se descarcă JS-ul.
         React îl înlocuiește la primul render. -->
    <style>
      html, body, #root { height: 100%; margin: 0; }
      .sg-boot { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px;
        background: radial-gradient(ellipse 75% 70% at 50% 45%, #0f4b3b 0%, #08382b 52%, #04231b 100%);
        font-family: 'Nunito', ui-rounded, system-ui, sans-serif; }
      .sg-boot-orb { position: relative; width: 168px; height: 168px; }
      .sg-boot-disc { position: absolute; inset: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 34% 28%, #3a937a 0%, #17654f 38%, #0d4a3a 72%, #0a3f31 100%);
        box-shadow: 0 18px 50px rgba(0,0,0,.35), inset 0 0 0 1px rgba(110,231,183,.18); }
      .sg-boot-disc img { height: 62%; filter: drop-shadow(0 0 1px #34d399) drop-shadow(0 0 7px rgba(52,211,153,.7)); }
      .sg-boot-orb svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;
        filter: drop-shadow(0 0 3px rgba(52,211,153,.75)); }
      .sg-boot-arc { transform-origin: 50px 50px; animation: sg-boot-spin 1.15s linear infinite; }
      .sg-boot-word { color: rgba(255,255,255,.85); font-weight: 800; font-size: 13px; letter-spacing: .2em; }
      .sg-boot-word i { font-style: normal; color: rgba(255,255,255,.4); margin: 0 8px; }
      .sg-boot-word b { font-weight: 700; letter-spacing: .06em; }
      @keyframes sg-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .sg-boot-arc { animation: none; } }
    </style>
    <div id="root">
      <div class="sg-boot" role="status" aria-label="Se încarcă Signa">
        <div class="sg-boot-orb">
          <span class="sg-boot-disc"><img src="/logo.png" alt="" /></span>
          <svg viewBox="0 0 100 100" aria-hidden="true" style="transform: rotate(-90deg)">
            <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(52,211,153,.22)" stroke-width="1.4" />
            <g class="sg-boot-arc"><circle cx="50" cy="50" r="48" fill="none" stroke="#34d399" stroke-width="1.4"
              stroke-linecap="round" stroke-dasharray="84.4 301.6" /></g>
          </svg>
        </div>
        <span class="sg-boot-word">SIGNA<i>|</i><b>signa-lsr.online</b></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
